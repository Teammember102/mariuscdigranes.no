name: Refresh Bergen hourly forecast

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bergen-weather.yml
      - scripts/update_bergen_weather.py

permissions:
  contents: write

concurrency:
  group: bergen-weather-refresh
  cancel-in-progress: false

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Request forecast from MET Norway with identified User-Agent
        run: python3 scripts/update_bergen_weather.py
      - name: Publish weather cache for the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bergen-weather.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Bergen hourly weather [skip ci]"
            git push
          fi
