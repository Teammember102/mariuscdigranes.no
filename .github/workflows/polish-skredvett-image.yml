name: Polish Skredvett portfolio image

on:
  push:
    paths:
      - scripts/polish_skredvett_image.py
      - .github/workflows/polish-skredvett-image.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skredvett-image-polish
  cancel-in-progress: false

jobs:
  polish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check pillow opencv-python-headless
      - name: Remove duplicate map label and upscale existing mockups
        run: python scripts/polish_skredvett_image.py
      - name: Commit the corrected high resolution image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skredvett-lyngen-telefoner.webp
          if ! git diff --cached --quiet; then
            git commit -m "Improve Skredvett image resolution and remove duplicate label [skip ci]"
            git push
          fi
